<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>City Service Request Triage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      padding: 2rem;
    }

    h1 { font-size: 1.6rem; color: #2b6cb0; margin-bottom: 0.25rem; }
    .subtitle { color: #718096; font-size: 0.95rem; margin-bottom: 2rem; }

    /* ── Cards ── */
    .card {
      background: white;
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 2rem;
      max-width: 680px;
    }

    .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #2d3748; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 0.3rem;
    }

    input, textarea, select {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      background: #f7fafc;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #4299e1;
      background: white;
    }

    textarea { resize: vertical; min-height: 90px; }

    button {
      background: #2b6cb0;
      color: white;
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #2c5282; }

    #status-msg { margin-top: 0.75rem; font-size: 0.9rem; }
    .success { color: #276749; }
    .error   { color: #c53030; }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .filter-bar label { margin-bottom: 0.2rem; }

    .filter-group { display: flex; flex-direction: column; min-width: 160px; }

    .filter-bar select {
      margin-bottom: 0;
      width: 100%;
    }

    .btn-clear {
      background: #e2e8f0;
      color: #4a5568;
      padding: 0.55rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      align-self: flex-end;
    }

    .btn-clear:hover { background: #cbd5e0; }

    /* ── Dashboard ── */
    .dashboard { max-width: 1100px; }
    .dashboard h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #2d3748; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-size: 0.85rem;
    }

    thead { background: #2b6cb0; color: white; }
    th, td { padding: 0.7rem 0.9rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f7fafc; }

    /* ── Priority badges ── */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-critical { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
    .badge-high     { background: #fffaf0; color: #c05621; border: 1px solid #fbd38d; }
    .badge-medium   { background: #fffff0; color: #b7791f; border: 1px solid #faf089; }
    .badge-low      { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
    .badge-general  { background: #e2e8f0; color: #4a5568; border: 1px solid #cbd5e0; }

    /* ── Category badges ── */
    .cat-safety      { background: #fff5f5; color: #c53030; }
    .cat-maintenance { background: #ebf8ff; color: #2b6cb0; }
    .cat-sanitation  { background: #f0fff4; color: #276749; }
    .cat-facility    { background: #faf5ff; color: #6b46c1; }
    .cat-IT          { background: #fffff0; color: #b7791f; }
    .cat-general     { background: #e2e8f0; color: #4a5568; }

    .cat-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    /* ── Status dropdown in table ── */
    .status-select {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      border: 1px solid #cbd5e0;
      font-size: 0.8rem;
      background: white;
      cursor: pointer;
      width: auto;
      margin-bottom: 0;
    }

    /* ── Recommended action ── */
    .action-text {
      font-size: 0.78rem;
      color: #4a5568;
      font-style: italic;
      max-width: 220px;
    }

    /* ── Record count ── */
    .record-count {
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 0.75rem;
    }
  </style>
</head>

<body>

  <h1>🏙️ City Service Request Triage</h1>
  <p class="subtitle">Los Angeles — Department of General Services</p>

  <!-- ── SUBMISSION FORM ────────────────────────────── -->
  <div class="card">
    <h2>Submit a Service Request</h2>

    <label for="description">Description</label>
    <textarea
      id="description"
      placeholder="Describe the issue in detail (e.g. Broken streetlight near 5th and Main)"
    ></textarea>

    <label for="location">Location</label>
    <input
      type="text"
      id="location"
      placeholder="Street address or intersection (e.g. 5th Street and Main St, Los Angeles)"
    />

    <button onclick="submitRequest()">Submit Request</button>
    <p id="status-msg"></p>
  </div>

  <!-- ── DASHBOARD ──────────────────────────────────── -->
  <div class="dashboard">
    <h2>📋 Service Request Dashboard</h2>

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="filter-group">
        <label>Category</label>
        <select id="filter-category" onchange="applyFilters()">
          <option value="">All Categories</option>
          <option value="safety">Safety</option>
          <option value="maintenance">Maintenance</option>
          <option value="sanitation">Sanitation</option>
          <option value="facility">Facility</option>
          <option value="IT">IT</option>
          <option value="general">General</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Priority</label>
        <select id="filter-priority" onchange="applyFilters()">
          <option value="">All Priorities</option>
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Status</label>
        <select id="filter-status" onchange="applyFilters()">
          <option value="">All Statuses</option>
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="resolved">Resolved</option>
        </select>
      </div>

      <button class="btn-clear" onclick="clearFilters()">Clear Filters</button>
    </div>

    <p class="record-count" id="record-count"></p>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Description</th>
          <th>Location</th>
          <th>Category</th>
          <th>Priority</th>
          <th>Recommended Action</th>
          <th>Status</th>
          <th>Submitted</th>
        </tr>
      </thead>
      <tbody id="requests-table">
        <tr>
          <td colspan="8" style="color:#718096">Loading requests...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    // ── SUBMIT A NEW REQUEST ──────────────────────────
    async function submitRequest() {
      const description = document.getElementById("description").value.trim();
      const location    = document.getElementById("location").value.trim();
      const statusMsg   = document.getElementById("status-msg");

      if (!description || !location) {
        statusMsg.textContent = "Please fill in both fields.";
        statusMsg.className = "error";
        return;
      }

      try {
        const response = await fetch(`${API}/requests`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ description, location })
        });

        if (!response.ok) throw new Error("Submission failed");

        const saved = await response.json();

        statusMsg.textContent = `✅ Request #${saved.id} submitted — classified as ${saved.category} / ${saved.priority} priority.`;
        statusMsg.className = "success";
        document.getElementById("description").value = "";
        document.getElementById("location").value = "";

        applyFilters();

      } catch (err) {
        statusMsg.textContent = "❌ Error submitting request. Is the API running?";
        statusMsg.className = "error";
      }
    }

    // ── APPLY FILTERS AND RELOAD DASHBOARD ───────────
    async function applyFilters() {
      const category = document.getElementById("filter-category").value;
      const priority = document.getElementById("filter-priority").value;
      const status   = document.getElementById("filter-status").value;

      // Build URL with only the filters that were selected
      const params = new URLSearchParams();
      if (category) params.append("category", category);
      if (priority) params.append("priority", priority);
      if (status)   params.append("status", status);

      const url = `${API}/requests${params.toString() ? "?" + params.toString() : ""}`;

      await loadRequests(url);
    }

    // ── CLEAR ALL FILTERS ─────────────────────────────
    function clearFilters() {
      document.getElementById("filter-category").value = "";
      document.getElementById("filter-priority").value = "";
      document.getElementById("filter-status").value = "";
      loadRequests(`${API}/requests`);
    }

    // ── LOAD REQUESTS INTO DASHBOARD ─────────────────
    async function loadRequests(url = `${API}/requests`) {
      const tbody = document.getElementById("requests-table");
      const countEl = document.getElementById("record-count");

      try {
        const response = await fetch(url);
        const requests = await response.json();

        countEl.textContent = `Showing ${requests.length} request${requests.length !== 1 ? "s" : ""}`;

        if (requests.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" style="color:#718096;padding:1rem">
            No requests match the selected filters.
          </td></tr>`;
          return;
        }

        tbody.innerHTML = requests.map(r => `
          <tr>
            <td>${r.id}</td>
            <td>${r.description}</td>
            <td>${r.location}</td>
            <td><span class="cat-badge cat-${r.category}">${r.category ?? "—"}</span></td>
            <td>${priorityBadge(r.priority)}</td>
            <td><span class="action-text">${r.recommended_action ?? "—"}</span></td>
            <td>
              <select
                class="status-select"
                onchange="updateStatus(${r.id}, this.value)"
              >
                <option value="open"        ${r.status === "open"        ? "selected" : ""}>Open</option>
                <option value="in_progress" ${r.status === "in_progress" ? "selected" : ""}>In Progress</option>
                <option value="resolved"    ${r.status === "resolved"    ? "selected" : ""}>Resolved</option>
              </select>
            </td>
            <td>${formatDate(r.created_at)}</td>
          </tr>
        `).join("");

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="error" style="padding:1rem">
          Cannot connect to API. Make sure uvicorn is running.
        </td></tr>`;
      }
    }

    // ── UPDATE REQUEST STATUS ─────────────────────────
    async function updateStatus(requestId, newStatus) {
      try {
        await fetch(`${API}/requests/${requestId}/status?status=${newStatus}`, {
          method: "PATCH"
        });
        // Reload with current filters active
        applyFilters();
      } catch (err) {
        alert("Failed to update status. Is the API running?");
      }
    }

    // ── HELPERS ───────────────────────────────────────
    function priorityBadge(priority) {
      if (!priority) return `<span class="badge badge-general">—</span>`;
      return `<span class="badge badge-${priority}">${priority}</span>`;
    }

    function formatDate(isoString) {
      if (!isoString) return "—";
      const d = new Date(isoString);
      return d.toLocaleString("en-US", {
        month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    // Load all requests when the page first opens
    loadRequests();
  </script>

</body>
</html>
