# ── CI/CD Pipeline ────────────────────────────────────────────────
# City Service Triage Agent
# Runs on every push and pull request to main branch
# ──────────────────────────────────────────────────────────────────

name: CI Pipeline

# ── Triggers ──────────────────────────────────────────────────────
# When does this pipeline run?
on:
  push:
    branches: [ main ]      # Run on every push to main
  pull_request:
    branches: [ main ]      # Run on every pull request to main

# ── Jobs ──────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Test ─────────────────────────────────────────────────
  # Run pytest directly with Python (fast, catches errors early)
  test:
    name: Run Tests
    runs-on: ubuntu-latest  # Fresh Linux VM provided by GitHub

    steps:
      # Step 1: Check out your repository code
      # Without this the VM has no code to work with
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python 3.11
      # The runner has Python but we specify exact version
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Cache pip packages
      # Speeds up subsequent runs — doesn't re-download packages
      # that haven't changed
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Step 5: Run pytest
      # If any test fails this step fails and the pipeline stops
      - name: Run pytest
        run: |
          cd backend
          pytest tests/ -v

  # ── Job 2: Docker Build ──────────────────────────────────────────
  # Build the Docker image to confirm the Dockerfile works
  # Only runs after the test job passes
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test             # Only run if test job passes

    steps:
      # Step 1: Check out code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      # Buildx is an extended Docker build tool
      # Enables advanced features like multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build the Docker image
      # We don't push it to a registry yet (that's Phase 5 - AWS)
      # --load means load the built image into local Docker
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: false         # Don't push to registry yet
          load: true          # Load into local Docker daemon
          tags: city-triage-agent:ci

      # Step 4: Run tests inside the Docker container
      # This confirms the container environment works correctly
      # Not just that Python works on the runner
      - name: Run tests inside Docker
        run: |
          docker run --rm city-triage-agent:ci \
            pytest tests/ -v

      # Step 5: Verify the health endpoint works
      - name: Verify health endpoint
        run: |
          docker run -d -p 8000:8000 --name test-container city-triage-agent:ci
          sleep 5
          curl -f http://localhost:8000/health
          docker rm -f test-container